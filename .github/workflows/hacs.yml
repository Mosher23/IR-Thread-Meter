name: Validate HACS integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hacs.yml
      - custom_components/**
      - hacs.json
      - README.md
  pull_request:
    paths:
      - .github/workflows/hacs.yml
      - custom_components/**
      - hacs.json
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
